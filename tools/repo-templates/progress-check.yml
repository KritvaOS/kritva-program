# progress-check.yml: fails when status/STATUS.md differs from status/program_snapshot.json (D-120).
# It reads only files in this repository, so a change in kritva-program never turns it red by itself.
name: progress-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  progress-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check the progress report against its snapshot
        run: python3 scripts/progress_report.py --check
