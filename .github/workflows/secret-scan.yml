# secret-scan.yml: Blocking gitleaks scan of the full git history
# Security control from kritva-program decision D-032 (follow-up).

name: secret-scan

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.18.4"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (release checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == f { print $1 "  gitleaks.tgz" }' checksums.txt | tee expected.sha256
          test -s expected.sha256
          sha256sum -c expected.sha256
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full git history
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
